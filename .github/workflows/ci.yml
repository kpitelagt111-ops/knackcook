# KnackCook CI — runs on every push to main and on PRs targeting main.
# Two jobs in parallel:
#   1. `quality` — lint + typecheck + Vitest (fast, ~3 min)
#   2. `e2e` — full Playwright suite against a real Postgres/Redis/Meilisearch stack (~6-8 min)
# Each step has its OWN timeout so a hanging step fails fast instead of consuming the whole 20-min job budget.

name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.5.0"

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1 — Static quality gates (typecheck, lint, unit tests). Fast feedback.
  # ----------------------------------------------------------------------------
  quality:
    name: Lint + typecheck + Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        timeout-minutes: 2
        run: pnpm prisma generate

      - name: TypeScript typecheck
        timeout-minutes: 3
        run: pnpm typecheck

      - name: Biome lint
        timeout-minutes: 2
        run: pnpm lint

      - name: Vitest (unit + integration)
        timeout-minutes: 3
        run: pnpm test

  # ----------------------------------------------------------------------------
  # JOB 2 — E2E Playwright against a production-like stack.
  # ----------------------------------------------------------------------------
  e2e:
    name: E2E Playwright (45 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knackcook
          POSTGRES_PASSWORD: knackcook
          POSTGRES_DB: knackcook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knackcook -d knackcook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_MASTER_KEY: ci-master-key-ci-master-key-ci-master-key
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700

    env:
      DATABASE_URL: postgresql://knackcook:knackcook@localhost:5432/knackcook?schema=public
      REDIS_URL: redis://localhost:6379
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_MASTER_KEY: ci-master-key-ci-master-key-ci-master-key
      AUTH_SECRET: ci-auth-secret-not-prod-32-chars-min-len
      INGEST_API_KEY: ci-ingest-bearer-only-for-ci-runs
      AMAZON_TAG_US: knackcook-20
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium + system deps)
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Prisma client
        timeout-minutes: 2
        run: pnpm prisma generate

      - name: Apply database migrations
        timeout-minutes: 3
        run: pnpm prisma migrate deploy

      - name: Seed SUPER_ADMIN user
        timeout-minutes: 1
        run: node scripts/seed-admin.mjs

      - name: Seed EDITOR user
        timeout-minutes: 1
        env:
          EDITOR_EMAIL: editor@knackcook.com
          EDITOR_PASSWORD: Editor12345!
          EDITOR_NAME: CI Editor
        run: node scripts/seed-editor.mjs

      # E2E tests the REAL shipping artifact: the Docker image (same as
      # prod/staging). A bare `next build` + standalone server on the Ubuntu
      # runner emits an absolute middleware-rewrite that triggers an infinite
      # 307 redirect loop (ERR_TOO_MANY_REDIRECTS) — NOT reproducible in the
      # Alpine Docker image that actually ships. So we build & run the image.
      - name: Build app Docker image (the shipping artifact)
        timeout-minutes: 10
        run: docker build -t knackcook-app:ci .

      - name: Run app container (prod-identical runtime)
        timeout-minutes: 3
        run: |
          # --network host: the container reaches the GitHub service containers
          # (postgres/redis/meilisearch) on localhost, exactly like the host
          # steps that ran migrations + seeding. It also exposes :3000 on the
          # runner host for Playwright + the seeding scripts.
          docker run -d --name knackcook-app --network host \
            -e PORT=3000 \
            -e HOSTNAME=0.0.0.0 \
            -e NODE_ENV=production \
            -e NEXT_TELEMETRY_DISABLED=1 \
            -e DATABASE_URL \
            -e REDIS_URL \
            -e MEILISEARCH_HOST \
            -e MEILISEARCH_MASTER_KEY \
            -e AUTH_SECRET \
            -e INGEST_API_KEY \
            -e AMAZON_TAG_US \
            -e NEXT_PUBLIC_SITE_URL \
            knackcook-app:ci
          ready=0
          for i in {1..40}; do
            if curl -s --max-time 2 -o /dev/null http://127.0.0.1:3000/ 2>/dev/null; then
              echo "App responds after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "App did not respond within 40s. Container logs:"
            docker logs knackcook-app
            exit 1
          fi
          echo "--- sanity: / should be 200 (no redirect loop) ---"
          curl -sI --max-time 5 http://127.0.0.1:3000/ | head -3
          curl -sI --max-time 5 http://127.0.0.1:3000/blog | head -3

      - name: Seed sample products + articles via ingestion API
        timeout-minutes: 3
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node scripts/n8n-mock.mjs

      - name: Publish mock drafts (DRAFT -> PUBLISHED)
        # n8n-mock.mjs creates DRAFT content (per AGENTS.md §7). In prod an editor
        # publishes manually from the back office. For CI we run the existing
        # publish-drafts.mjs script which scopes the publish to MOCK* ASINs only.
        timeout-minutes: 2
        run: node scripts/publish-drafts.mjs

      - name: Run Playwright E2E suite
        timeout-minutes: 8
        run: pnpm test:e2e

      - name: Dump container logs (always, for debugging)
        if: always()
        run: docker logs knackcook-app 2>&1 | tail -200 || true

      - name: Stop app container
        if: always()
        run: docker rm -f knackcook-app 2>/dev/null || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7