# KnackCook (affiliate-kk) — Nginx reverse proxy
# Sits behind Cloudflare (SSL terminated at the edge). See docs/ARCHITECTURE.md §14.4.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Rate limiting (REQ §9 security). Public API + tracking get a tighter zone.
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=ingest:10m rate=2r/s;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  upstream app {
    server app:3000;
  }

  server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/knackcook/cert.pem;
    ssl_certificate_key /etc/ssl/knackcook/key.pem;

    client_max_body_size 5m;

    # Own media served from the filesystem, long cache (Cloudflare in front).
    location /media/ {
      alias /var/app/media/;
      expires 30d;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # Ingestion API: tight rate limit (n8n only).
    location /api/ingest/ {
      limit_req zone=ingest burst=5 nodelay;
      proxy_pass http://app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Other API routes (tracking, admin).
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
